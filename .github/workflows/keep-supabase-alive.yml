name: Keep Supabase Alive

on:
  schedule:
    # Cada 3 días a las 12:00 UTC (margen amplio frente al límite de 7 días)
    - cron: '0 12 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API (with retries)
        run: |
          SUPABASE_URL="https://dyzwlxhghmkrnuvesxqf.supabase.co"
          ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR5endseGhnaG1rcm51dmVzeHFmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ1Njk3MjQsImV4cCI6MjA5MDE0NTcyNH0.b3TWo5ZUd-qB1PHIc6ct2IlL14nT2nTVNh7l6qAU8ew"

          # Reintentar hasta 5 veces con espera creciente.
          # Los proyectos Free pausados pueden tardar 1-2 min en despertar.
          for attempt in 1 2 3 4 5; do
            echo "=== Attempt $attempt ==="
            RESPONSE=$(curl -s -w "\n%{http_code}" --max-time 60 \
              "$SUPABASE_URL/rest/v1/channel?select=id&limit=1" \
              -H "apikey: $ANON_KEY" \
              -H "Authorization: Bearer $ANON_KEY" || echo -e "\n000")

            BODY=$(echo "$RESPONSE" | sed '$d')
            STATUS=$(echo "$RESPONSE" | tail -n1)

            echo "Status: $STATUS"
            echo "Body: $BODY"

            if [ "$STATUS" = "200" ]; then
              echo "Supabase is alive!"
              exit 0
            fi

            # Si es 5xx o timeout, el proyecto puede estar despertando
            if [ $attempt -lt 5 ]; then
              WAIT=$((attempt * 30))
              echo "Retrying in ${WAIT}s..."
              sleep $WAIT
            fi
          done

          echo "::error::Supabase ping failed after 5 attempts (last status: $STATUS)"
          echo "::error::If NXDOMAIN persists, the project may need manual restore at https://supabase.com/dashboard"
          exit 1
